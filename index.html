<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dream Station 夢想轉運站</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>body{font-family:Inter,"Noto Sans TC",sans-serif}.panel{background:#0f172acc;border:1px solid #334155;border-radius:1rem;padding:1rem}.field{width:100%;background:#1e293b;border:1px solid #475569;border-radius:.65rem;padding:.65rem;color:#f8fafc}.btn{border-radius:.65rem;padding:.55rem .85rem;font-weight:700;font-size:.8rem}.primary{background:#4f46e5}.secondary{background:#334155}.danger{background:#be123c}.success{background:#047857}.muted{color:#94a3b8}.tab.active{border-bottom:2px solid #22d3ee;color:#67e8f9}.hidden{display:none!important}</style></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<header class="bg-slate-900 border-b border-indigo-500/40"><div class="max-w-7xl mx-auto px-4 py-7 flex flex-wrap justify-between items-center gap-4"><div><div class="text-cyan-300 text-xs tracking-[.3em]">DREAM STATION</div><h1 id="appTitle" class="text-3xl font-black mt-1">夢想轉運站</h1><p id="appSubtitle" class="text-indigo-200 text-sm mt-1">這裡沒有標準答案，只有你的無限可能</p></div><div class="flex items-center gap-3"><span id="userLabel" class="text-sm muted">訪客</span><button id="authButton" class="btn primary" onclick="openAuth()">登入 / 註冊</button></div></div></header>
<main class="max-w-7xl mx-auto p-4 space-y-5">
<section class="rounded-2xl p-5 bg-gradient-to-r from-amber-700 to-indigo-700"><div class="text-xs font-bold">老師重要布達</div><h2 id="announceTitle" class="font-bold text-xl mt-2">歡迎來到 Dream Station</h2><p id="announceContent" class="mt-2 text-sm">平台公告載入中…</p><div id="announceTime" class="text-xs mt-2 opacity-80"></div></section>
<nav class="flex gap-2 border-b border-slate-700 overflow-x-auto"><button class="tab active p-3" onclick="tab('discuss')">分類討論版</button><button class="tab p-3" onclick="tab('order')">餐點確認區</button><button class="tab p-3" onclick="tab('photos')">活動課程相簿</button><button id="adminTab" class="tab p-3 hidden" onclick="tab('admin')">後台管理</button></nav>
<section id="view-discuss" class="space-y-4"><div class="flex flex-wrap justify-between gap-2"><div class="flex flex-wrap gap-2"><button class="btn secondary" onclick="setFilter('all')">全部</button><button class="btn secondary" onclick="setFilter('課業交流')">課業交流</button><button class="btn secondary" onclick="setFilter('活動籌備')">活動籌備</button><button class="btn secondary" onclick="setFilter('閒聊打屁')">閒聊打屁</button></div><button class="btn primary" onclick="newPost()">＋ 發表貼文</button></div><div id="posts" class="space-y-3"></div></section>
<section id="view-order" class="hidden grid md:grid-cols-3 gap-4"><div class="md:col-span-2 space-y-3"><div class="flex justify-between items-center"><h2 class="font-bold text-xl">活動餐點預訂</h2><button id="addProductBtn" class="btn success hidden" onclick="addProduct()">＋ 上架餐點</button></div><div id="products" class="grid sm:grid-cols-2 gap-3"></div></div><aside class="panel"><h3 class="font-bold mb-3">我的購物車</h3><div id="cart" class="space-y-2"></div><div class="border-t border-slate-700 mt-4 pt-3 flex justify-between"><b>總計</b><b id="cartTotal" class="text-cyan-300">NT$ 0</b></div><button class="btn primary w-full mt-3" onclick="placeOrder()">送出點餐</button></aside></section>
<section id="view-photos" class="hidden space-y-4"><div class="flex justify-between"><h2 class="text-xl font-bold">活動課程花絮相簿</h2><button class="btn primary" onclick="addPhoto()">新增照片</button></div><div id="photos" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div></section>
<section id="view-admin" class="hidden space-y-5"><div class="flex flex-wrap justify-between items-center"><h2 class="text-xl font-bold">老師後台管理與審核中心</h2><button class="btn success" onclick="backup()">下載 JSON 備份</button></div><div class="panel"><h3 class="font-bold text-amber-300 mb-3">待審貼文</h3><div id="pending" class="space-y-2"></div></div><div class="panel"><h3 class="font-bold mb-3">平台設定與公告</h3><div class="grid md:grid-cols-2 gap-3"><input id="clubName" class="field" placeholder="平台名稱"><input id="clubSubtitle" class="field" placeholder="副標題"><input id="aTitle" class="field md:col-span-2" placeholder="公告標題"><textarea id="aContent" class="field md:col-span-2" rows="3" placeholder="公告內容"></textarea></div><button class="btn primary mt-3" onclick="saveSettings()">儲存設定與公告</button></div><div class="panel"><h3 class="font-bold mb-3">學生訂單總覽</h3><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead><tr class="text-cyan-300"><th class="p-2">訂單編號</th><th class="p-2">學生</th><th class="p-2">內容</th><th class="p-2">金額</th><th class="p-2">時間</th></tr></thead><tbody id="orders"></tbody></table></div></div><div class="panel"><h3 class="font-bold mb-3">帳號管理</h3><p class="text-sm muted">老師權限請由 Apps Script 編輯器執行 promoteTeacher(email)，不可由註冊表單自行選擇。</p></div></section>
<div id="toast" class="fixed bottom-4 right-4 bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 hidden shadow-xl"></div>
</main>
<div id="authModal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4"><div class="panel w-full max-w-md space-y-3"><div class="flex justify-between"><h3 class="font-bold text-lg">帳號登入 / 註冊</h3><button onclick="closeAuth()">✕</button></div><div class="flex gap-3"><button class="btn secondary" onclick="authMode='login';drawAuth()">登入</button><button class="btn secondary" onclick="authMode='register';drawAuth()">學生註冊</button></div><input id="authUser" class="field" placeholder="Email 或學號"><input id="authName" class="field" placeholder="姓名（註冊時填寫）"><input id="authPass" type="password" class="field" placeholder="密碼（至少 8 碼）"><button id="authSubmit" class="btn primary w-full" onclick="submitAuth()">登入</button><p class="text-xs muted">老師帳號由管理者建立；公開註冊一律為學生。</p></div></div>
<div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden items-center justify-center p-4" onclick="this.classList.add('hidden')"><img id="lightboxImg" class="max-w-full max-h-full object-contain"></div>
<script>
// 設定 GAS Web App 部署後的 /exec 網址
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxjd67eXtuoIgqHkJnfCCyGKUIHyFdcTaaGTdeSfYmrF4vP73a7RQD0CHghG8IDQib-gw/exec';
const $ = id => document.getElementById(id);
let token=localStorage.getItem('ds_session')||'', me=null, state={settings:{},announcement:{},posts:[],pendingPosts:[],products:[],orders:[],photos:[]},cart=[],filter='all',authMode='login';
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2800)}
function jsonp(params){return new Promise((resolve,reject)=>{const cb='ds_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>{cleanup();reject(Error('伺服器逾時，請稍後重試'))},18000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=d=>{cleanup();resolve(d)};script.onerror=()=>{cleanup();reject(Error('無法連線 Apps Script，請確認部署網址及存取權限'))};script.src=GAS_URL+'?'+new URLSearchParams({...params,callback:cb}).toString();document.body.appendChild(script)})}
async function api(action,payload={}){if(!GAS_URL.startsWith('https://script.google.com/macros/s/'))throw Error('請先在 index.html 設定正確的 GAS_URL');const rid=crypto.randomUUID();const body={rid,action,payload,token};await fetch(GAS_URL,{method:'POST',mode:'no-cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});for(let i=0;i<12;i++){await new Promise(r=>setTimeout(r,650));const r=await jsonp({action:'poll',rid});if(r&&r.ready){if(!r.result.ok)throw Error(r.result.error||'操作失敗');return r.result.data}}throw Error('伺服器處理逾時，請重新整理後確認資料是否已送出')}
async function refresh(){state=await api('state');renderAll()}
function renderAll(){const s=state.settings||{}; $('appTitle').textContent=s.name||'Dream Station 夢想轉運站';$('appSubtitle').textContent=s.subtitle||'這裡沒有標準答案，只有你的無限可能';const a=state.announcement||{};$('announceTitle').textContent=a.title||'尚無公告';$('announceContent').textContent=a.content||'';$('announceTime').textContent=a.time||'';$('userLabel').textContent=me?`${me.name}（${me.role==='teacher'?'老師':'學生'}）`:'訪客';$('authButton').textContent=me?'登出':'登入 / 註冊';$('adminTab').classList.toggle('hidden',!me||me.role!=='teacher');$('addProductBtn').classList.toggle('hidden',!me||me.role!=='teacher');renderPosts();renderProducts();renderCart();renderPhotos();if(me?.role==='teacher')renderAdmin()}
function tab(name){if(name==='admin'&&me?.role!=='teacher')return;['discuss','order','photos','admin'].forEach(n=>$('view-'+n).classList.toggle('hidden',n!==name));document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['discuss','order','photos','admin'][i]===name))}
function setFilter(v){filter=v;renderPosts()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderPosts(){const root=$('posts');root.replaceChildren();(state.posts||[]).filter(p=>filter==='all'||p.topic===filter).forEach(p=>{const d=document.createElement('article');d.className='panel space-y-3';d.innerHTML=`<div class="flex flex-wrap justify-between gap-2"><div><span class="text-cyan-300 text-xs">#${esc(p.topic)}</span> <b class="text-sm">${esc(p.author)}</b> <span class="muted text-xs">${esc(p.time)}</span></div><button class="text-rose-300 text-xs" data-del="${esc(p.id)}">刪除</button></div><p class="text-sm whitespace-pre-wrap">${esc(p.content)}</p><div class="flex gap-4 text-xs"><button data-like="${esc(p.id)}">👍 讚（${Number(p.likes)||0}）</button><span class="muted">留言（${(p.comments||[]).length}）</span></div><div class="space-y-2">${(p.comments||[]).map((c,i)=>`<div class="text-xs bg-slate-800 p-2 rounded"><b class="text-cyan-300">${esc(c.author)}</b> ${esc(c.text)} <button class="text-rose-300 ml-2" data-cdel="${esc(p.id)}:${i}">刪除</button></div>`).join('')}</div><div class="flex gap-2"><input class="field text-xs" id="comment-${esc(p.id)}" placeholder="寫下回覆…"><button class="btn secondary" data-comment="${esc(p.id)}">回覆</button></div>`;d.querySelector('[data-del]').hidden=!(me&&(me.role==='teacher'||p.owner===me.username));d.querySelectorAll('[data-cdel]').forEach(b=>b.hidden=!me||me.role!=='teacher');d.querySelector('[data-del]').onclick=()=>run(()=>api('deletePost',{id:p.id}));d.querySelector('[data-like]').onclick=()=>run(()=>api('likePost',{id:p.id}));d.querySelector('[data-comment]').onclick=()=>run(async()=>{const text=$('comment-'+p.id).value.trim();if(!text)throw Error('請輸入留言');await api('comment',{id:p.id,text})});d.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>run(()=>api('deleteComment',{id:p.id,index:Number(b.dataset.cdel.split(':')[1])})));root.append(d)})}
function newPost(){if(!me)return openAuth();const topic=prompt('選擇分類：課業交流／活動籌備／閒聊打屁','課業交流');if(!topic)return;const content=prompt('請輸入貼文內容');if(content?.trim())run(()=>api('createPost',{topic,content:content.trim()}))}
function renderProducts(){const root=$('products');root.replaceChildren();(state.products||[]).filter(p=>p.active!==false).forEach(p=>{const d=document.createElement('div');d.className='panel';d.innerHTML=`<img class="w-full h-36 object-cover rounded-lg mb-3" src="${esc(p.img||'https://placehold.co/400x300?text=Meal')}" alt="${esc(p.name)}"><b>${esc(p.name)}</b><div class="text-cyan-300 mt-1">NT$ ${Number(p.price)||0}</div><div class="text-xs muted mt-1">庫存 ${Number(p.stock)||0}</div><div class="flex gap-2 mt-3"><input class="field w-20" type="number" min="1" max="99" value="1"><button class="btn primary flex-1">加入購物車</button></div>`;d.querySelector('button').onclick=()=>{const qty=Math.max(1,Math.min(99,Number(d.querySelector('input').value)||1));const old=cart.find(x=>x.id===p.id);if(old)old.qty+=qty;else cart.push({id:p.id,name:p.name,price:Number(p.price),qty});renderCart()};root.append(d)})}
function renderCart(){$('cart').innerHTML=cart.length?cart.map((x,i)=>`<div class="flex justify-between text-sm gap-2"><span>${esc(x.name)} × ${x.qty}</span><button class="text-rose-300" onclick="cart.splice(${i},1);renderCart()">移除</button></div>`).join(''):'<p class="muted text-sm">購物車目前是空的</p>';$('cartTotal').textContent='NT$ '+cart.reduce((s,x)=>s+x.price*x.qty,0)}
function placeOrder(){if(!me)return openAuth();if(!cart.length)return toast('購物車是空的');run(async()=>{await api('placeOrder',{items:cart.map(x=>({id:x.id,qty:x.qty}))});cart=[];renderCart();toast('訂單已送出')})}
function renderPhotos(){const root=$('photos');root.replaceChildren();(state.photos||[]).forEach(p=>{const d=document.createElement('button');d.className='panel text-left';d.innerHTML=`<img class="w-full aspect-square object-cover rounded-lg" src="${esc(p.url)}" alt="${esc(p.title)}"><div class="text-sm mt-2">${esc(p.title)}</div>`;d.onclick=()=>{$('lightboxImg').src=p.url;$('lightbox').classList.remove('hidden');$('lightbox').classList.add('flex')};root.append(d)})}
function renderAdmin(){ $('clubName').value=state.settings?.name||'';$('clubSubtitle').value=state.settings?.subtitle||'';$('aTitle').value=state.announcement?.title||'';$('aContent').value=state.announcement?.content||'';$('pending').innerHTML=(state.pendingPosts||[]).map(p=>`<div class="bg-slate-800 p-3 rounded flex flex-wrap justify-between gap-2"><div><b>${esc(p.author)}</b> · ${esc(p.topic)}<p class="text-sm mt-1">${esc(p.content)}</p></div><div class="flex gap-2"><button class="btn success" onclick="moderate('${esc(p.id)}',true)">核准</button><button class="btn danger" onclick="moderate('${esc(p.id)}',false)">退回</button></div></div>`).join('')||'<p class="muted text-sm">目前沒有待審貼文</p>';$('orders').innerHTML=(state.orders||[]).map(o=>`<tr class="border-t border-slate-700"><td class="p-2">${esc(o.id)}</td><td class="p-2">${esc(o.student)}</td><td class="p-2">${(o.items||[]).map(i=>esc(i.name)+' × '+i.qty).join('、')}</td><td class="p-2">${o.total}</td><td class="p-2">${esc(o.time)}</td></tr>`).join('')||'<tr><td colspan="5" class="p-3 muted">尚無訂單</td></tr>'}
function moderate(id,approve){run(()=>api('moderatePost',{id,approve}))}
function addProduct(){if(!me||me.role!=='teacher')return;const name=prompt('餐點名稱');if(!name)return;const price=Number(prompt('價格（元）','60'));const stock=Number(prompt('庫存數量','30'));const img=prompt('圖片網址（可留空）','');run(()=>api('addProduct',{name,price,stock,img}))}
function addPhoto(){if(!me)return openAuth();const title=prompt('照片標題');const url=prompt('照片網址（https://）');if(title&&url)run(()=>api('addPhoto',{title,url}))}
function saveSettings(){run(()=>api('saveSettings',{settings:{name:$('clubName').value,subtitle:$('clubSubtitle').value},announcement:{title:$('aTitle').value,content:$('aContent').value}}))}
function backup(){run(async()=>{const d=await api('backup');const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dream_station_backup_'+Date.now()+'.json';a.click();URL.revokeObjectURL(a.href)})}
function openAuth(){$('authModal').classList.remove('hidden');$('authModal').classList.add('flex');drawAuth()}function closeAuth(){$('authModal').classList.add('hidden');$('authModal').classList.remove('flex')}
function drawAuth(){$('authName').classList.toggle('hidden',authMode!=='register');$('authSubmit').textContent=authMode==='register'?'建立學生帳號':'登入'}
async function submitAuth(){const username=$('authUser').value.trim(),password=$('authPass').value,name=$('authName').value.trim();run(async()=>{if(authMode==='register'){await api('register',{username,password,name});toast('註冊成功，請登入');authMode='login';drawAuth();return}const r=await api('login',{username,password});token=r.token;localStorage.setItem('ds_session',token);me=r.user;closeAuth();await refresh();toast('登入成功')})}
async function logout(){try{await api('logout')}catch(e){}token='';me=null;localStorage.removeItem('ds_session');renderAll();toast('已登出')}
async function run(fn){try{await fn();await refresh()}catch(e){toast(e.message||'發生錯誤')}}
$('authButton').onclick=()=>me?logout():openAuth();
(async()=>{try{if(token){try{const r=await api('whoami');me=r.user||null;if(!me){token='';localStorage.removeItem('ds_session')}}catch(_){token='';localStorage.removeItem('ds_session')}}await refresh()}catch(e){toast(e.message)}})();
</script></body></html>
